<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراقبة شركاء تم</title>
<style>
:root{
  --g0:#022f24;--g1:#047857;--g2:#10b981;--ink:#064e3b;--ink2:#35574c;--mut:#5b7a70;
  --bg:#eef6f2;--card:#ffffff;--line:#e2ece7;--danger:#d92d20;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b1f19;--card:#102b23;--line:#1e3a30;--ink:#eafaf2;--ink2:#bcd9ca;--mut:#89b2a2}
}
:root[data-theme="dark"]{--bg:#0b1f19;--card:#102b23;--line:#1e3a30;--ink:#eafaf2;--ink2:#bcd9ca;--mut:#89b2a2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 'Cairo','Segoe UI',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;width:100%;max-width:360px;box-shadow:0 20px 40px #0002}
.box h1{font-size:19px;margin:0 0 6px}
.box p{color:var(--mut);margin:0 0 20px;font-size:13px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:12px;color:var(--mut)}
.fld input{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:transparent}
.btn{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:700;padding:12px;cursor:pointer;margin-top:6px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
#app{display:none;height:100%}
#app.show{display:flex}
.side{width:280px;flex:none;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;height:100%}
.side header{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.side header b{font-size:15px}
.net{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--line)}
.net.on{color:#fff;background:var(--g2)}
.net.off{color:#fff;background:var(--danger)}
.search{padding:10px 14px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:transparent}
.list{overflow-y:auto;flex:1}
.item{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.item:hover{background:var(--bg)}
.item.active{background:var(--bg)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.badge{font-size:10px;background:var(--line);padding:2px 7px;border-radius:99px;color:var(--mut)}
.main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.main header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px}
.main header b{font-size:15px}
.main header small{color:var(--mut)}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:65%;padding:9px 13px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg .who{font-size:11px;color:var(--g1);font-weight:700;margin-bottom:3px}
.msg .t{font-size:10px;color:var(--mut);margin-top:4px;text-align:left}
.empty{flex:1;display:grid;place-items:center;color:var(--mut)}
.del{flex:none;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:16px;padding:6px;border-radius:8px}
.del:hover{background:var(--line);color:var(--danger)}
.main header{justify-content:space-between}
.hdLeft{display:flex;align-items:center;gap:10px;min-width:0}
.hdLeft b,.hdLeft small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delBtn{border:1px solid var(--line);background:transparent;color:var(--danger);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:12.5px;font-weight:700;flex:none}
.delBtn:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--card)}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer;color:var(--mut);font-size:13px;font-weight:700}
.tab.active{color:var(--g1);border-bottom:2px solid var(--g1)}
.toolbar{display:flex;gap:8px;padding:10px 14px}
.toolbar button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px;color:var(--ink)}
@media (max-width:760px){
  #app.show{flex-direction:column}
  .side{width:100%;height:42%;border-left:0;border-bottom:1px solid var(--line)}
  .main{height:58%}
}
</style>

<div id="login">
  <div class="box">
    <h1>لوحة مراقبة شركاء تم</h1>
    <p>دخول مخصّص للإدارة فقط — لعرض المحادثات والمجموعات في النسخة التجريبية.</p>
    <div class="fld"><label>رقم الأدمن</label><input id="u" inputmode="numeric" autocomplete="off"></div>
    <div class="fld"><label>كلمة السر</label><input id="p" type="password" autocomplete="off"></div>
    <button class="btn" id="go">دخول</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app">
  <div class="side">
    <header><b>المحادثات</b><span class="net" id="net">—</span></header>
    <div class="tabs">
      <div class="tab active" data-f="all">الكل</div>
      <div class="tab" data-f="group">مجموعات</div>
      <div class="tab" data-f="private">خاصة</div>
    </div>
    <div class="search"><input id="q" placeholder="بحث بالاسم…"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="main">
    <header id="chatHead"><b>اختر محادثة من القائمة</b></header>
    <div class="msgs" id="msgs"><div class="empty">لا توجد محادثة مفتوحة</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  // ---- دخول الأدمن (حماية بسيطة من طرف العميل فقط؛ لا تضع فيها أسراراً حقيقية) ----
  const ADMIN_ID = "112233";
  const ADMIN_PASS = "0033";

  const $ = (s, r=document) => r.querySelector(s);
  $('#go').onclick = () => {
    if ($('#u').value.trim() === ADMIN_ID && $('#p').value === ADMIN_PASS) {
      $('#login').style.display = 'none';
      $('#app').classList.add('show');
      boot();
    } else {
      $('#err').textContent = 'رقم الأدمن أو كلمة السر غير صحيحة.';
    }
  };
  $('#p').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });

  // ---- إعداد نفس مشروع Firebase المستخدم في تطبيق "شركاء تم" ----
  const firebaseConfig = {
    apiKey: "AIzaSyAWwseNz4ZYtVHzqmeSWasACy2sGLVsKwU",
    authDomain: "ftyii-5b67e.firebaseapp.com",
    projectId: "ftyii-5b67e",
    storageBucket: "ftyii-5b67e.firebasestorage.app",
    messagingSenderId: "499418803548",
    appId: "1:499418803548:web:10e3d1b8ce110a32292599"
  };
  const COL = { users: 'ph_users', chats: 'ph_chats' };

  let db = null;
  const users = new Map();   // id -> {name, username, type}
  const chats = new Map();   // id -> {type, name, members, msgs:[], created, unsub}
  let activeChat = null;
  let filter = 'all';

  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function setNet(state){
    const el = $('#net');
    el.textContent = state === 'on' ? 'متصل' : state === 'off' ? 'غير متصل' : 'جارٍ الاتصال…';
    el.className = 'net ' + (state === 'on' ? 'on' : state === 'off' ? 'off' : '');
  }

  function userName(id){
    const u = users.get(id);
    return u ? (u.name || u.username || id) : id;
  }

  function chatTitle(c){
    if (c.type === 'group') return c.name || 'مجموعة';
    const other = c.members.find(m => true); // show both members for private chats
    return c.members.map(userName).join(' ↔ ');
  }

  function renderList(){
    const q = $('#q').value.trim().toLowerCase();
    const list = $('#list');
    const arr = Array.from(chats.values())
      .filter(c => filter === 'all' || c.type === filter)
      .filter(c => !q || chatTitle(c).toLowerCase().includes(q))
      .sort((a,b) => (lastT(b) - lastT(a)));
    list.innerHTML = arr.map(c => {
      const last = c.msgs[c.msgs.length - 1];
      const title = chatTitle(c);
      const initial = (title || '؟').trim().charAt(0);
      return `<div class="item ${activeChat===c.id?'active':''}" data-id="${esc(c.id)}">
        <div class="av">${esc(initial)}</div>
        <div class="meta">
          <b>${esc(title)}</b>
          <small>${last ? esc(userName(last.from))+': '+esc(last.text) : 'لا رسائل بعد'}</small>
        </div>
        <span class="badge">${c.type==='group' ? 'مجموعة' : 'خاصة'}</span>
        <button class="del" data-del="${esc(c.id)}" title="حذف">🗑</button>
      </div>`;
    }).join('') || '<div class="empty" style="padding:30px">لا توجد محادثات مطابقة</div>';
    list.querySelectorAll('.item').forEach(el => {
      el.onclick = () => openChat(el.dataset.id);
    });
    list.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); deleteChat(el.dataset.del); };
    });
  }
  function lastT(c){ const m = c.msgs[c.msgs.length-1]; return m ? m.t : (c.created||0); }

  function openChat(id){
    activeChat = id;
    renderList();
    const c = chats.get(id);
    if (!c) return;
    $('#chatHead').innerHTML = `
      <div class="hdLeft"><b>${esc(chatTitle(c))}</b><small>&nbsp;·&nbsp;${c.members.length} أعضاء</small></div>
      <button class="delBtn" id="delCur">حذف ${c.type==='group'?'المجموعة':'المحادثة'}</button>`;
    $('#delCur').onclick = () => deleteChat(c.id);
    renderMsgs(c);
  }
  function resetMain(){
    $('#chatHead').innerHTML = '<b>اختر محادثة من القائمة</b>';
    $('#msgs').innerHTML = '<div class="empty">لا توجد محادثة مفتوحة</div>';
  }

  async function deleteChat(id){
    const c = chats.get(id);
    const label = c && c.type === 'group' ? 'المجموعة' : 'المحادثة';
    if (!confirm(`هل تريد حذف ${label} نهائياً؟ سيُحذف كل محتواها من السيرفر ولا يمكن التراجع.`)) return;
    try{
      const msgsRef = db.collection(COL.chats).doc(id).collection('msgs');
      let snap;
      do{
        snap = await msgsRef.limit(450).get();
        if (snap.empty) break;
        const batch = db.batch();
        snap.forEach(d => batch.delete(d.ref));
        await batch.commit();
      } while (snap.size === 450);
      await db.collection(COL.chats).doc(id).delete();
      chats.delete(id);
      if (activeChat === id) { activeChat = null; resetMain(); }
      renderList();
    }catch(err){
      alert('تعذّر الحذف: ' + err.message + '\nتأكد أن قواعد Firestore تسمح للأدمن بالحذف.');
    }
  }

  function renderMsgs(c){
    const box = $('#msgs');
    if (!c.msgs.length) { box.innerHTML = '<div class="empty">لا رسائل في هذه المحادثة</div>'; return; }
    box.innerHTML = c.msgs.map(m => `
      <div class="msg">
        <div class="who">${esc(userName(m.from))}</div>
        <div>${esc(m.text)}${m.del ? ' <i>(محذوفة)</i>' : ''}</div>
        <div class="t">${new Date(m.t).toLocaleString('ar')}</div>
      </div>`).join('');
    box.scrollTop = box.scrollHeight;
  }

  function attachMsgs(id){
    db.collection(COL.chats).doc(id).collection('msgs').orderBy('t', 'asc').limit(1000)
      .onSnapshot(snap => {
        const c = chats.get(id);
        if (!c) return;
        c.msgs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        renderList();
        if (activeChat === id) renderMsgs(c);
      }, err => console.error('msgs', id, err));
  }

  function boot(){
    setNet('connecting');
    db = firebase.initializeApp(firebaseConfig).firestore();

    db.collection(COL.users).onSnapshot(snap => {
      users.clear();
      snap.forEach(d => users.set(d.id, d.data()));
      renderList();
      if (activeChat) openChat(activeChat);
    }, err => { console.error('users', err); setNet('off'); });

    db.collection(COL.chats).onSnapshot(snap => {
      setNet('on');
      const seen = new Set();
      snap.forEach(d => {
        seen.add(d.id);
        const data = d.data();
        if (!chats.has(d.id)) {
          chats.set(d.id, { id: d.id, msgs: [], ...data });
          attachMsgs(d.id);
        } else {
          Object.assign(chats.get(d.id), data);
        }
      });
      Array.from(chats.keys()).forEach(id => { if (!seen.has(id)) chats.delete(id); });
      renderList();
    }, err => { console.error('chats', err); setNet('off'); });
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      filter = t.dataset.f;
      renderList();
    };
  });
  $('#q').addEventListener('input', renderList);
})();
</script>
</html>
